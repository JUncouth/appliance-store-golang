events {}

http {
    include /etc/nginx/mime.types;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        font/opentype
        image/svg+xml
        image/x-icon;

    proxy_cache_path /var/cache/nginx keys_zone=my_cache:10m;

    upstream read_only {
        server api-main:8081 weight=2;
        server api-help1:8082 weight=1;
        server api-help2:8083 weight=1;    
    }

    upstream main {
        server api-main:8081;
    }

    map $request_method $backend {
        GET read_only;
        default main;
    }

    server {
        listen 80;

        server_name xoxotyh-appliance-store;

        return 308 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name xoxotyh-appliance-store;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        proxy_cache my_cache;
        proxy_cache_methods GET;
        proxy_cache_valid 200 10m;

        add_header X-Cache-Status $upstream_cache_status always;

        location /api/v1 {
            add_header X-Backend-Server $upstream_addr always;

            proxy_no_cache 1;
            proxy_cache_bypass 1;

            proxy_pass http://$backend;
        }

        location /api/ {
            rewrite ^/api/(.*)$ /api/v1/$1 last;
        }

        location = /api {
            return 301 /docs/swagger;
        }

        location = /api/ {
            return 301 /docs/swagger;
        }

        location = /api/v1 {
            return 301 /docs/swagger;
        }

        location = /api/v1/ {
            return 301 /docs/swagger;
        }

        location / {
            root /etc/nginx/static;

            expires 7d;
        }

        location /status {
            stub_status on;
        }

        location /admin {
            proxy_set_header X-Script-Name /admin;
            proxy_pass http://pgadmin:8084;
        }
    }
}