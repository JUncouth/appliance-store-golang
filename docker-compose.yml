services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: $(POSTGRES_DB)
      POSTGRES_USER: $(POSTGRES_USER)
      POSTGRES_PASSWORD: $(POSTGRES_PASSWORD)
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./migrations/002_init.sql:/docker-entrypoint-initdb.d/002_init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U storeapi -d storeapi" ]
      interval: 5s
      timeout: 3s
      retries: 10

  api-main:
    build: .
    image: storeapi:latest
    environment:
      HTTP_PORT: $(HTTP_MAIN_PORT)
      DATABASE_URL: $(DATABASE_MAIN_URL)
      SHUTDOWN_TIMEOUT: $(SHUTDOWN_TIMEOUT)
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  api-help1:
    # build: .
    image: storeapi:latest
    environment:
      HTTP_PORT: $(HTTP_2_PORT)
      DATABASE_URL: $(DATABASE_RO_URL)
      SHUTDOWN_TIMEOUT: $(SHUTDOWN_TIMEOUT)
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

  api-help2:
    # build: .
    image: storeapi:latest
    environment:
      HTTP_PORT: $(HTTP_3_PORT)
      DATABASE_URL: $(DATABASE_RO_URL)
      SHUTDOWN_TIMEOUT: $(SHUTDOWN_TIMEOUT)
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:8
    environment:
      PGADMIN_DEFAULT_EMAIL: $(PGADMIN_DEFAULT_EMAIL)
      PGADMIN_DEFAULT_PASSWORD: $(PGADMIN_DEFAULT_PASSWORD)
      PGADMIN_LISTEN_PORT: $(PGADMIN_LISTEN_PORT)
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      api-main:
        condition: service_started
      api-help1:
        condition: service_started
      api-help2:
        condition: service_started
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro

  nginx:
    image: nginx:stable
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      postgres:
        condition: service_healthy
      api-main:
        condition: service_started
      api-help1:
        condition: service_started
      api-help2:
        condition: service_started
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/static:/etc/nginx/static:ro

volumes:
  postgres-data:
  pgadmin-data:
